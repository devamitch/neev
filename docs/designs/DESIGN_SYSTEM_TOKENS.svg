<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#B8A99B"/></marker><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#9A8370" flood-opacity="0.10"/></filter></defs><rect width="1800" height="1080" fill="#FAF9F5"/><text x="64" y="78" font-family="Georgia, Times New Roman, serif" font-size="43" font-weight="650" text-anchor="start" fill="#1A1815" letter-spacing="0">BlinkQuest</text><text x="64" y="123" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#B95D3F" letter-spacing="0">Pixel-perfect design system</text><text x="64" y="158" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">Use as implementation tokens; reference collages are illustrative, not a substitute for these measured rules.</text><line x1="64" y1="185" x2="1736" y2="185" stroke="#E5E2D9" stroke-width="2"/><text x="70" y="230" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#5F5B56" letter-spacing="1.5">COLOR TOKENS · LIGHT ONLY</text><rect x="70" y="255" width="176" height="78" rx="16" fill="#FAF9F5" stroke="#D6CBBF" stroke-width="1"/><text x="70" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Canvas</text><text x="70" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#FAF9F5</text><rect x="277" y="255" width="176" height="78" rx="16" fill="#FDFDFB" stroke="#D6CBBF" stroke-width="1"/><text x="277" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Surface 1</text><text x="277" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#FDFDFB</text><rect x="484" y="255" width="176" height="78" rx="16" fill="#F0EEE6" stroke="#D6CBBF" stroke-width="1"/><text x="484" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Surface 2</text><text x="484" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#F0EEE6</text><rect x="691" y="255" width="176" height="78" rx="16" fill="#E5E2D9" stroke="#D6CBBF" stroke-width="1"/><text x="691" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Surface 3</text><text x="691" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#E5E2D9</text><rect x="898" y="255" width="176" height="78" rx="16" fill="#DA7756" stroke="#D6CBBF" stroke-width="1"/><text x="898" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Terracotta</text><text x="898" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#DA7756</text><rect x="1105" y="255" width="176" height="78" rx="16" fill="#1A1815" stroke="#D6CBBF" stroke-width="1"/><text x="1105" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Primary ink</text><text x="1105" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#1A1815</text><rect x="1312" y="255" width="176" height="78" rx="16" fill="#5F5B56" stroke="#D6CBBF" stroke-width="1"/><text x="1312" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Secondary ink</text><text x="1312" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#5F5B56</text><rect x="1519" y="255" width="176" height="78" rx="16" fill="#7D9C7B" stroke="#D6CBBF" stroke-width="1"/><text x="1519" y="362" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Sage status</text><text x="1519" y="386" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">#7D9C7B</text><path d="M70,420 L1730,420" fill="none" stroke="#E5E2D9" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="465" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#5F5B56" letter-spacing="1.5">TYPE SCALE</text><text x="70" y="525" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Display / screen title</text><text x="70" y="566" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#1A1815" letter-spacing="0">Section heading · 24 / semibold</text><text x="70" y="602" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">Body copy · 16 / regular · clear line height, no dense paragraphs.</text><text x="70" y="636" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#5F5B56" letter-spacing="0">Caption / metadata · 12–13 / medium · never below accessible minimums.</text><text x="70" y="700" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#5F5B56" letter-spacing="1.5">CORE COMPONENTS</text><rect x="70" y="730" width="360" height="100" rx="20" fill="#FFFFFF" stroke="#CDBFB0" stroke-width="2"/><text x="90" y="760" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#5F5B56" letter-spacing="0">Primary action</text><rect x="90" y="775" width="320" height="40" rx="20" fill="#DA7756" stroke="#DA7756" stroke-width="1"/><text x="250" y="801" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#FFFFFF" letter-spacing="0">Start scanning</text><rect x="465" y="730" width="360" height="100" rx="20" fill="#FFFFFF" stroke="#CDBFB0" stroke-width="2"/><text x="485" y="760" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#5F5B56" letter-spacing="0">Secondary action</text><rect x="485" y="775" width="320" height="40" rx="20" fill="#F0EEE6" stroke="#E5E2D9" stroke-width="1"/><text x="645" y="801" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1A1815" letter-spacing="0">View history</text><rect x="860" y="730" width="360" height="100" rx="20" fill="#FFFFFF" stroke="#CDBFB0" stroke-width="2"/><text x="880" y="760" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#5F5B56" letter-spacing="0">Metric card</text><text x="884" y="802" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="650" text-anchor="start" fill="#1A1815" letter-spacing="0">18</text><text x="920" y="801" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="450" text-anchor="start" fill="#5F5B56" letter-spacing="0">blinks/min</text><text x="1165" y="801" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="end" fill="#7D9C7B" letter-spacing="0">Normal</text><rect x="1255" y="730" width="475" height="100" rx="20" fill="#FFFFFF" stroke="#CDBFB0" stroke-width="2"/><text x="1275" y="760" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#5F5B56" letter-spacing="0">Input / search field</text><rect x="1275" y="775" width="435" height="40" rx="20" fill="#FAF9F5" stroke="#E5E2D9" stroke-width="1"/><text x="1295" y="801" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5F5B56" letter-spacing="0">Search topics or local tools…</text><text x="70" y="895" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#5F5B56" letter-spacing="1.5">SCANNER RULES</text><text x="70" y="930" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1A1815" letter-spacing="0">• One canonical Scan route; real live landmarks only; unavailable states when inputs are invalid or stale.</text><text x="70" y="957" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1A1815" letter-spacing="0">• Scanner camera preview may be dark photographic content; surrounding app chrome stays light-only.</text><text x="70" y="984" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1A1815" letter-spacing="0">• PiP controls must be native, compact, readable and stoppable; reflect actual OS PiP state.</text><text x="70" y="1030" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="550" text-anchor="start" fill="#B95D3F" letter-spacing="0">No emoji-driven visual language · minimal line icons · consistent 8-point spacing grid · restrained elevation · purposeful motion only</text></svg>